const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(key){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(key),"PBKDF2",false,["deriveKey"]);
  const k=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(BOX.salt),iterations:210000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const t=new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-GCM",iv:b(BOX.iv)},k,b(BOX.data)));
  try{localStorage.setItem("mihon-key",key)}catch(_){}
  document.open();document.write(t);document.close();
}
document.getElementById("f").onsubmit=async e=>{e.preventDefault();
  try{await open(document.getElementById("k").value)}catch(_){document.getElementById("e").textContent="合言葉が違います"}};
(async()=>{let s=null;try{s=localStorage.getItem("mihon-key")}catch(_){}
  if(s){try{await open(s)}catch(_){try{localStorage.removeItem("mihon-key")}catch(_){}}}})();
